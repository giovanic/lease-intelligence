# Moved from apps/api/.github (GitHub only reads .github at the repo root).
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
